correctEngineerRoleCounting: "Contar ingenieros en los cupos de tropas"
correctEngineerRoleCounting_descr: "Cuenta los ingenieros asignados a su grupo. Las dotaciones de asedio, los excavadores y los trabajadores del aceite conservan funciones separadas."
safeSiegePlacement: "Proteger unidades en obras de asedio"
safeSiegePlacement_descr: "Evita construir sobre unidades propias. Prevalece el valor del AIC de cada IA."
actualSiegeResourcePayment: "Exigir recursos para el asedio"
actualSiegeResourcePayment_descr: "Comprueba materiales y oro antes de construir. Los faltantes pasan al comercio habitual de la IA. El valor AIC de cada IA tiene prioridad."
coordinatedSiegeHarassment: "Coordinar el hostigamiento de asedio"
coordinatedSiegeHarassment_descr: "Reúne máquinas de asedio y las envía a posiciones de tiro accesibles. Tiene prioridad el valor AIC de cada IA."
siegeHarassMinEngines: "Máquinas para el hostigamiento"
siegeHarassMinEngines_descr: "Cantidad que espera antes de avanzar. Tras un mes de juego envía las disponibles; 0 envía la primera."
largerSiegeForces: "Más máquinas en el ataque principal"
largerSiegeForces_descr: "Repite la composición de asedio de esta IA hasta alcanzar su límite. Prevalece el valor AIC de cada IA."
siegeForceMax: "Máquinas por ataque principal"
siegeForceMax_descr: "Límite opcional de máquinas. Con 0, decide la cantidad de ingenieros de ataque disponibles; valor predeterminado: 0."
patrolOrders: "Segunda patrulla de ataque"
patrolOrders_descr: "Envía también el segundo grupo de patrulla de ataque de la IA a los asaltos. Prevalece el valor AIC de cada IA."
patrolOrders_all: "Ambos grupos de patrulla"
patrolOrders_native: "Solo el primer grupo"
patrolFormation: "Posición de las demás patrullas"
patrolFormation_descr: "Adónde van los demás grupos de patrulla: junto al primero, al otro lado del castillo objetivo o a un anillo a su alrededor."
patrolFormation_wing: "Junto al primer grupo"
patrolFormation_mirror: "Al otro lado del castillo"
patrolFormation_native: "Ruta propia"
patrolSpacing: "Separación de patrullas"
patrolSpacing_descr: "Casillas entre los grupos de patrulla cuando van lado a lado; predeterminado 12."
lordHuntRetarget: "Asediar el refugio del señor"
lordHuntRetarget_descr: "Si el señor de un jugador humano se refugia tras los muros de un aliado donde los atacantes no pueden entrar, la IA ataca ese castillo. Prevalece el valor AIC de cada IA."
lordHuntSiege: "Asedio completo en"
lordHuntSiege_descr: "Qué castillo recibe el campamento de asedio y las máquinas cuando el ejército se divide; el otro recibe parte de las tropas."
lordHuntSiege_hiding: "El castillo donde se oculta"
lordHuntSiege_home: "El castillo propio del señor"
lordHuntSplitShare: "Reparto"
lordHuntSplitShare_descr: "Porcentaje del ejército enviado al otro castillo mientras el del señor aún tenga gente y edificios; predeterminado 50."
lordHuntSwitchPercent: "Cambiar solo con"
lordHuntSwitchPercent_descr: "Durante un ataque, la IA solo cambia de castillo mientras le quede este porcentaje del ejército; predeterminado 80."
lordHuntShare: "Parte para la caza"
lordHuntShare_descr: "Porcentaje del ejército en el castillo del señor que va directo a por él cuando el camino está abierto; 0 desactiva la caza."
patrolFormation_routes: "Alrededor del castillo y por su frente"
patrolExtraGroups: "Grupos de patrulla extra"
patrolExtraGroups_descr: "Divide la patrulla de la IA en más grupos durante un ataque, siempre que cada uno conserve el tamaño mínimo. Se reúnen al terminar; 0 mantiene los grupos de la IA."
patrolMinSize: "Grupo de patrulla mínimo"
patrolMinSize_descr: "Unidades que conserva cada grupo al dividir la patrulla; predeterminado 4."
patrolRadius: "Distancia del anillo de patrulla"
patrolRadius_descr: "Distancia a pie desde el castillo objetivo hasta el anillo que siguen las patrullas que rodean y barren; predeterminado 12, como la patrulla del juego."
siegeScreen: "Escolta de máquinas de asedio"
siegeScreen_descr: "Dónde se colocan los grupos de defensa del asedio mientras trabajan sus máquinas: delante de ellas, los dos grupos en máquinas distintas o en el punto de reunión del juego."
siegeScreen_engineApproach: "Delante de las máquinas"
siegeScreen_native: "Punto de reunión del juego"
siegeScreenForward: "Distancia de escolta"
siegeScreenForward_descr: "Casillas delante de las máquinas para la escolta cuerpo a cuerpo; la escolta a distancia se queda junto a ellas. Predeterminado 4."
siegeScreenExtraGroups: "Grupos de escolta extra"
siegeScreenExtraGroups_descr: "Divide los grupos de defensa del asedio en más grupos mientras trabajan las máquinas, siempre que cada uno conserve el tamaño mínimo; cada grupo guarda su máquina. Se reúnen antes del asalto a la muralla; 0 mantiene los dos grupos de la IA. Requiere la escolta de máquinas."
siegeTowerCrew: "Tripular las torres de asedio"
siegeTowerCrew_descr: "Si las torres de asedio se pueden escalar, la IA sube sus tropas de defensa del asedio a sus torres que avanzan hacia la muralla. Prevalece el valor del AIC de cada IA."
allyRelief: "Socorro a aliados"
allyRelief_descr: "Una IA envía parte de su ejército inactivo a un aliado (tú u otra IA) cuyo castillo sufre un ataque, y cuando le pides ayuda. Prevalece el valor AIC de cada IA."
allyArmySharePercent: "Parte del ejército de socorro"
allyArmySharePercent_descr: "Porcentaje del ejército de ataque inactivo que va a ayudar; el resto se queda. 0 no envía tropas, ni siquiera si lo pides; predeterminado 75."
allyReliefMinMonths: "Estancia mínima del socorro"
allyReliefMinMonths_descr: "Meses que el socorro se queda como mínimo, aunque el aliado ya esté tranquilo. Su propio ataque, su propio peligro o tu llamada lo hacen volver igualmente. 0 lo hace volver tras un mes tranquilo."
allyReliefGates: "Abrir puertas al socorro"
allyReliefGates_descr: "Si las puertas del aliado están cerradas, el socorro va a una puerta y esta se abre para él, también al marcharse. Los enemigos cercanos pueden colarse tras él."
allyReliefKeep: "Socorro en la fortaleza"
allyReliefKeep_descr: "Las tropas de socorro se sitúan en la fortaleza del aliado, como con la ayuda del juego, en lugar de en su entrada."
allyGoods: "Bienes y oro entre aliados"
allyGoods_descr: "Los aliados IA se dan bienes y oro que no pueden comprar, y un aliado IA te envía oro cuando lo pides. Prevalece el valor AIC de cada IA."
allyGoldKeep: "Oro reservado al dar"
allyGoldKeep_descr: "Oro que una IA guarda siempre para reclutar antes de dar nada, también cuando lo pides; predeterminado 1000."
allyRecruitGoldBuffer: "Ayuda en oro para reclutar"
allyRecruitGoldBuffer_descr: "Una IA débil o amenazada recibe ayuda hasta su oro de reclutamiento más esta cantidad; predeterminado 300."
allyGoldSharePercent: "Oro junto a los bienes"
allyGoldSharePercent_descr: "Porcentaje del oro por encima de la reserva que una IA añade por su cuenta a un regalo de bienes. 0 no añade nada, pero el oro pedido se envía igual; predeterminado 25."
allyMonthlyGivePercent: "Límite mensual de regalos"
allyMonthlyGivePercent_descr: "Porcentaje de cada bien, oro incluido, que una IA regala al mes. 0 no regala nada; predeterminado 30."
diagnostics: "Registro de diagnóstico"
diagnostics_descr: "Escribe en el registro de UCP las decisiones de cada IA sobre la caza del señor, la ayuda a aliados, los regalos y las patrullas adicionales. Desactivado por defecto."
ai: IA
fixes: Correcciones
improvements: Mejoras
