patrolOrders: "Segunda patrulla de ataque"
patrolOrders_descr: "Envía también el segundo grupo de patrulla de ataque de la IA a los asaltos. Prevalece el valor AIC de cada IA."
patrolOrders_all: "Ambos grupos de patrulla"
patrolOrders_native: "Solo el primer grupo"
patrolFormation: "Posición de las demás patrullas"
patrolFormation_descr: "Adónde van los demás grupos de patrulla: junto al primero, al otro lado del castillo objetivo o a un anillo a su alrededor."
patrolFormation_wing: "Junto al primer grupo"
patrolFormation_mirror: "Al otro lado del castillo"
patrolFormation_native: "Ruta propia"
lordHuntRetarget: "Asediar el refugio del señor"
lordHuntRetarget_descr: "Si el señor de un jugador humano se refugia tras los muros de un aliado donde los atacantes no pueden entrar, la IA ataca ese castillo. Prevalece el valor AIC de cada IA."
patrolFormation_routes: "Alrededor del castillo y por su frente"
siegeScreen: "Escolta de máquinas de asedio"
siegeScreen_descr: "Dónde se colocan los grupos de defensa del asedio mientras trabajan sus máquinas: delante de ellas, los dos grupos en máquinas distintas o en el punto de reunión del juego."
siegeScreen_engineApproach: "Delante de las máquinas"
siegeScreen_native: "Punto de reunión del juego"
siegeTowerCrew: "Tripular las torres de asedio"
siegeTowerCrew_descr: "Si las torres de asedio se pueden escalar, la IA sube sus tropas de defensa del asedio a sus torres que avanzan hacia la muralla. Prevalece el valor del AIC de cada IA."
allyRelief: "Socorro a aliados"
allyRelief_descr: "Una IA envía parte de su ejército inactivo a un aliado (tú u otra IA) cuyo castillo sufre un ataque, y cuando le pides ayuda. Prevalece el valor AIC de cada IA."
allyGoods: "Bienes y oro entre aliados"
allyGoods_descr: "Los aliados IA se dan bienes y oro que no pueden comprar, y un aliado IA te envía oro cuando lo pides. Prevalece el valor AIC de cada IA."
