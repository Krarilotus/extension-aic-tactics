correctEngineerRoleCounting: "Mühendisleri birlik kotasında say"
correctEngineerRoleCounting_descr: "Atanmış mühendisleri birlik kotasına sayar. Kuşatma mürettebatı, hendek kazıcıları ve yağ görevlileri ayrı rollerinde kalır."
safeSiegePlacement: "Kuşatma alanındaki birlikleri koru"
safeSiegePlacement_descr: "Kendi birliklerinin üzerine kuşatma aracı kurmaz. Her yapay zekânın AIC değeri önceliklidir."
actualSiegeResourcePayment: "Kuşatma yapımı için kaynak gerektir"
actualSiegeResourcePayment_descr: "Yapımdan önce malzeme ve altını kontrol eder. Eksikler normal yapay zekâ ticaretine aktarılır. Her yapay zekânın AIC değeri önceliklidir."
coordinatedSiegeHarassment: "Kuşatma tacizini koordine et"
coordinatedSiegeHarassment_descr: "Kuşatma araçlarını toplayıp erişilebilir atış noktalarına gönderir. Her yapay zekânın AIC değeri önceliklidir."
siegeHarassMinEngines: "Taciz için araç sayısı"
siegeHarassMinEngines_descr: "Harekete geçmeden önce beklenecek araç sayısı. Bir oyun ayı sonra mevcut araçlar gider; 0 ilk araçla başlar."
largerSiegeForces: "Ana saldırıda daha fazla kuşatma aracı"
largerSiegeForces_descr: "Yapay zekânın mevcut kuşatma düzenini sınıra kadar tekrarlar. Her yapay zekânın AIC değeri önceliklidir."
siegeForceMax: "Ana saldırı başına araç"
siegeForceMax_descr: "İsteğe bağlı araç üst sınırı. 0 olduğunda sayı kullanılabilir saldırı mühendislerine bağlıdır; varsayılan 0."
patrolOrders: "İkinci saldırı devriyesi"
patrolOrders_descr: "Yapay zekânın ikinci saldırı devriye grubunu da hücuma gönderir. Her yapay zekânın AIC değeri önceliklidir."
patrolOrders_all: "İki devriye grubu"
patrolOrders_native: "Yalnızca ilk grup"
patrolFormation: "Diğer devriyelerin yeri"
patrolFormation_descr: "Diğer devriye grupları nereye gider: ilk grubun yanına, hedef kalenin öbür tarafına ya da çevresindeki bir halkaya."
patrolFormation_wing: "İlk grubun yanında"
patrolFormation_mirror: "Kalenin öbür tarafında"
patrolFormation_native: "Kendi rotası"
patrolSpacing: "Devriye aralığı"
patrolSpacing_descr: "Yan yana devriye grupları arasındaki kare sayısı; varsayılan 12."
lordHuntRetarget: "Lordun saklandığı kaleyi kuşat"
lordHuntRetarget_descr: "Bir insan oyuncunun lordu, saldıranların giremediği bir müttefik surlarının ardına sığınırsa yapay zekâ o kaleye saldırır. Her yapay zekânın AIC değeri önceliklidir."
lordHuntSiege: "Tam kuşatma"
lordHuntSiege_descr: "Ordu bölündüğünde kuşatma kampını ve araçları hangi kale alır; diğer kale birliklerin bir kısmını alır."
lordHuntSiege_hiding: "Lordun saklandığı kale"
lordHuntSiege_home: "Lordun kendi kalesi"
lordHuntSplitShare: "Bölünme payı"
lordHuntSplitShare_descr: "Lordun kendi kalesinde hâlâ halk ve bina varken diğer kaleye gönderilen ordu yüzdesi; varsayılan 50."
lordHuntSwitchPercent: "Kale değişimi için ordu"
lordHuntSwitchPercent_descr: "Saldırı sırasında yapay zekâ, yalnızca ordusunun bu yüzdesi kaldıkça başka kaleye geçer; varsayılan 80."
lordHuntShare: "Lord avı payı"
lordHuntShare_descr: "Yol açılınca lordun kalesindeki ordunun doğrudan ona yönelen yüzdesi; 0 avı kapatır."
patrolFormation_routes: "Kalenin çevresinde ve önü boyunca"
patrolExtraGroups: "Ek devriye grupları"
patrolExtraGroups_descr: "Saldırı sırasında, her grup en küçük boyutu korudukça yapay zekânın devriyesini daha çok gruba böler. Saldırı bitince birleşirler; 0 yapay zekânın kendi gruplarını korur."
patrolMinSize: "En küçük devriye grubu"
patrolMinSize_descr: "Devriye bölündüğünde her grubun tuttuğu birim sayısı; varsayılan 4."
patrolRadius: "Devriye halkası mesafesi"
patrolRadius_descr: "Dönen ve tarayan devriyelerin izlediği halkanın hedef kaleye yürüme mesafesi; varsayılan 12, oyunun kendi devriyesi gibi."
siegeScreen: "Kuşatma aracı muhafızı"
siegeScreen_descr: "Araçlar çalışırken yapay zekânın kuşatma savunma gruplarının durduğu yer: araçların önü, iki grup farklı araçlarda ya da oyunun kendi toplanma noktası."
siegeScreen_engineApproach: "Araçların önünde"
siegeScreen_native: "Oyunun toplanma noktası"
siegeScreenForward: "Muhafız mesafesi"
siegeScreenForward_descr: "Yakın dövüş muhafızlarının araçların önünde durduğu kare sayısı; menzilli muhafızlar araçların yanında kalır. Varsayılan 4."
siegeScreenExtraGroups: "Ek muhafız grupları"
siegeScreenExtraGroups_descr: "Araçlar çalışırken, her grup en küçük boyutu korudukça yapay zekânın kuşatma savunma gruplarını daha çok gruba böler; her grup kendi aracını korur. Sur hücumundan önce birleşirler; 0 yapay zekânın iki grubunu korur. Araç muhafızı gerekir."
siegeTowerCrew: "Kuşatma kulelerine asker bindir"
siegeTowerCrew_descr: "Kuşatma kulelerine tırmanılabiliyorsa yapay zekâ, surlara ilerleyen kulelerine mevcut saldırı dalgasındaki birlikleri bindirir. Her yapay zekânın AIC değeri önceliklidir."
allyRelief: "Müttefike takviye"
allyRelief_descr: "Yapay zekâ, kalesi saldırı altındaki bir müttefike (sana ya da bir yapay zekâya) ve sen yardım istediğinde boştaki ordusunun bir kısmını gönderir. Her yapay zekânın AIC değeri önceliklidir."
allyArmySharePercent: "Takviye ordu payı"
allyArmySharePercent_descr: "Yardıma giden boştaki saldırı ordusunun yüzdesi; kalanı evde kalır. 0 istendiğinde bile birlik göndermez; varsayılan 75."
allyReliefMinMonths: "Takviyenin en kısa kalışı"
allyReliefMinMonths_descr: "Müttefikin evi sakinleşse bile takviyenin en az kaldığı ay sayısı. Kendi saldırısı, kendi tehlikesi ya da senin çağrın onu yine eve döndürür. 0 bir sakin aydan sonra döndürür."
allyReliefGates: "Takviyeye kapı açma"
allyReliefGates_descr: "Müttefikin kapıları kapalıysa takviye bir kapıya yürür ve kapı ona açılır, ayrılırken de. Kapı yakınındaki düşmanlar peşinden girebilir."
allyReliefKeep: "İç kalede takviye"
allyReliefKeep_descr: "Takviye birlikleri, oyunun kendi yardımında olduğu gibi, müttefikin girişi yerine iç kalesinde durur."
allyGoods: "Müttefike mal ve altın"
allyGoods_descr: "Yapay zekâ müttefikleri birbirine alamadıkları mal ve altını verir; bir yapay zekâ müttefik istediğinde sana altın gönderir. Her yapay zekânın AIC değeri önceliklidir."
allyGoldKeep: "Verenin ayırdığı altın"
allyGoldKeep_descr: "Yapay zekânın bir şey vermeden önce kendi asker alımı için hep ayırdığı altın, sen istediğinde de; varsayılan 1000."
allyRecruitGoldBuffer: "Asker alımı için altın yardımı"
allyRecruitGoldBuffer_descr: "Zayıf ya da tehdit altındaki yapay zekâya, asker alımı altını artı bu miktara kadar yardım edilir; varsayılan 300."
allyGoldSharePercent: "Malla birlikte altın"
allyGoldSharePercent_descr: "Yapay zekânın istenmeden bir mal hediyesine eklediği, ayrılan altının üstündeki altın yüzdesi. 0 hiç eklemez, ama istenen altın yine gönderilir; varsayılan 25."
allyMonthlyGivePercent: "Aylık hediye sınırı"
allyMonthlyGivePercent_descr: "Yapay zekânın her maldan, altın dahil, ayda verdiği yüzde. 0 hiçbir şey vermez; varsayılan 30."
diagnostics: "Tanılama günlüğü"
diagnostics_descr: "Her yapay zekânın lord avı, müttefik yardımı, hediye ve ek devriye kararlarını UCP günlüğüne yazar. Varsayılan olarak kapalıdır."
