legacyRecruitInterval: Legacy asker alım hızını koru
legacyRecruitInterval_descr: 'Legacy ai_recruitinterval seçeneğinin yerine geçer: Native kişiliklerde aralık 1 olur. WeightedRoles, AIC aralıklarını kullanmaya devam eder. Legacy seçeneğini kapatın; önceden kapalıysa bu seçeneği de kapalı bırakın.'
nativeInitialDefenseMonths: Native yapay zekâlar için başlangıç savunma süresi
nativeInitialDefenseMonths_descr: '0–30 ay; varsayılan 6. Legacy başlangıç süresini buraya kopyalayıp o Legacy seçeneğini kapatın. WeightedRoles, RecruitInitialDefenseMonths değerini kullanır.'
nativeTargetPolicy: "Native yapay zekâ hedef seçimi"
nativeTargetPolicy_descr: "Legacy ai_attacktarget yerine geçer. Seçimini buraya kopyalayın ve yeni hedef kurallarında bu Legacy seçeneğini kapatın. Native, TargetChoice ayarını korur."
nativeTargetPolicy_native: "Mevcut TargetChoice"
nativeTargetPolicy_nearest: "En yakın"
nativeTargetPolicy_richest: "En zengin"
nativeTargetPolicy_weakest: "En zayıf"
correctEngineerRoleCounting: "Mühendisleri birlik kotasında say"
correctEngineerRoleCounting_descr: "Atanmış mühendisleri birlik kotasına sayar. Kuşatma mürettebatı, hendek kazıcıları ve yağ görevlileri ayrı rollerinde kalır."
safeSiegePlacement: "Kuşatma alanındaki birlikleri koru"
safeSiegePlacement_descr: "Kendi birliklerinin üzerine kuşatma aracı kurmaz. Her yapay zekânın AIC değeri önceliklidir."
actualSiegeResourcePayment: "Kuşatma yapımı için kaynak gerektir"
actualSiegeResourcePayment_descr: "Yapımdan önce malzeme ve altını kontrol eder. Eksikler normal yapay zekâ ticaretine aktarılır. Her yapay zekânın AIC değeri önceliklidir."
coordinatedSiegeHarassment: "Kuşatma tacizini koordine et"
coordinatedSiegeHarassment_descr: "Kuşatma araçlarını toplayıp erişilebilir atış noktalarına gönderir. Her yapay zekânın AIC değeri önceliklidir."
siegeHarassMinEngines: "Taciz için araç sayısı"
siegeHarassMinEngines_descr: "Harekete geçmeden önce beklenecek araç sayısı. Bir oyun ayı sonra mevcut araçlar gider; 0 ilk araçla başlar."
largerSiegeForces: "Ana saldırıda daha fazla kuşatma aracı"
largerSiegeForces_descr: "Yapay zekânın mevcut kuşatma düzenini sınıra kadar tekrarlar. Her yapay zekânın AIC değeri önceliklidir."
siegeForceMax: "Ana saldırı başına araç"
siegeForceMax_descr: "İsteğe bağlı araç üst sınırı. 0 olduğunda sayı kullanılabilir saldırı mühendislerine bağlıdır; varsayılan 0."
patrolOrders: "Second attack patrol"
patrolOrders_descr: "Send the AI's second attack patrol group into assaults as well. Each AI's AIC value takes precedence."
patrolOrders_all: "Both patrol groups"
patrolOrders_native: "First group only"
patrolFormation: "Second patrol position"
patrolFormation_descr: "Where the second patrol group goes: beside the first group, or the other side of the target castle."
patrolFormation_wing: "Beside the first group"
patrolFormation_mirror: "Other side of the castle"
patrolFormation_native: "Own route"
patrolSpacing: "Patrol spacing"
patrolSpacing_descr: "Tiles between the two patrol groups when side by side; default 12."
allyRelief: "Ally relief"
allyRelief_descr: "An AI sends part of its idle army to an ally (you or an AI) whose castle is under attack, and when you ask it for help. Each AI's AIC value takes precedence."
allyArmySharePercent: "Relief army share"
allyArmySharePercent_descr: "Percent of the idle attack army sent to help; the rest stays home. 0 sends no troops, also when asked; default 75."
allyGoods: "Ally goods and gold"
allyGoods_descr: "AI allies give each other goods and gold they cannot buy, and an AI ally sends you gold when you ask. Each AI's AIC value takes precedence."
allyGoldKeep: "Gold kept by givers"
allyGoldKeep_descr: "Gold an AI always keeps for its own recruiting before it gives any away, also when you ask; default 1000."
allyRecruitGoldBuffer: "Recruit gold help"
allyRecruitGoldBuffer_descr: "A weak or threatened AI is helped up to its recruiting gold plus this much; default 300."
allyGoldSharePercent: "Gold share with goods"
allyGoldSharePercent_descr: "Percent of the gold above the kept gold that an AI adds to a goods gift unasked. 0 adds none, but asked gold is still sent; default 25."
allyMonthlyGivePercent: "Monthly gift limit"
allyMonthlyGivePercent_descr: "Percent of each good, gold included, an AI gives away per month. 0 gives nothing; default 30."
