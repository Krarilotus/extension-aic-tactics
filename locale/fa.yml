legacyRecruitInterval: حفظ آهنگ سربازگیری Legacy
legacyRecruitInterval_descr: 'جایگزین ai_recruitinterval در Legacy می‌شود: شخصیت‌های Native از فاصلهٔ ۱ استفاده می‌کنند. WeightedRoles فاصله‌های AIC را نگه می‌دارد. گزینهٔ Legacy را خاموش کنید؛ اگر قبلاً خاموش بود، این گزینه را هم خاموش بگذارید.'
nativeInitialDefenseMonths: مدت دفاع اولیه برای هوش مصنوعی Native
nativeInitialDefenseMonths_descr: '۰ تا ۳۰ ماه؛ پیش‌فرض ۶. مقدار قبلی زمان‌سنج اولیهٔ Legacy را اینجا وارد کنید و آن گزینهٔ Legacy را خاموش کنید. WeightedRoles از RecruitInitialDefenseMonths استفاده می‌کند.'
nativeTargetPolicy: "انتخاب هدف برای هوش مصنوعی Native"
nativeTargetPolicy_descr: "جایگزین Legacy ai_attacktarget است. انتخاب آن را اینجا وارد کنید و هنگام استفاده از قواعد هدف‌گیری جدید، آن گزینهٔ Legacy را خاموش کنید. Native تنظیم TargetChoice را حفظ می‌کند."
nativeTargetPolicy_native: "TargetChoice فعلی"
nativeTargetPolicy_nearest: "نزدیک‌ترین"
nativeTargetPolicy_richest: "ثروتمندترین"
nativeTargetPolicy_weakest: "ضعیف‌ترین"
correctEngineerRoleCounting: "شمارش مهندسان در سهمیهٔ نیروها"
correctEngineerRoleCounting_descr: "مهندسانِ گماشته‌شده را در سهمیهٔ گروهشان می‌شمارد. خدمهٔ محاصره، خندق‌کن‌ها و کارکنان روغن نقش جداگانه دارند."
safeSiegePlacement: "حفاظت از نیروها هنگام ساخت ادوات محاصره"
safeSiegePlacement_descr: "روی نیروهای خودی ادوات محاصره نمی‌سازد. مقدار AIC هر هوش مصنوعی اولویت دارد."
actualSiegeResourcePayment: "نیاز به منابع برای ساخت ادوات محاصره"
actualSiegeResourcePayment_descr: "پیش از ساخت، مصالح و طلا را بررسی می‌کند. کمبودها وارد روند معمول خرید هوش مصنوعی می‌شوند. مقدار AIC هر هوش مصنوعی اولویت دارد."
coordinatedSiegeHarassment: "هماهنگی یورش ادوات محاصره"
coordinatedSiegeHarassment_descr: "ادوات محاصره را گرد می‌آورد و به مواضع تیراندازی قابل دسترس می‌فرستد. مقدار AIC هر هوش مصنوعی اولویت دارد."
siegeHarassMinEngines: "حداقل ادوات برای یورش"
siegeHarassMinEngines_descr: "تعداد ادواتی که پیش از حرکت منتظر می‌مانند. پس از یک ماه بازی، ادوات موجود اعزام می‌شوند؛ ۰ با اولین دستگاه حرکت می‌کند."
largerSiegeForces: "ادوات بیشتر برای حملهٔ اصلی"
largerSiegeForces_descr: "ترکیب محاصرهٔ همان هوش مصنوعی را تا سقف تعیین‌شده تکرار می‌کند. مقدار AIC هر هوش مصنوعی اولویت دارد."
siegeForceMax: "سقف ادوات در حملهٔ اصلی"
siegeForceMax_descr: "سقف اختیاری ابزارهای محاصره. با مقدار ۰، شمار مهندسان حملهٔ در دسترس تعداد را تعیین می‌کند؛ پیش‌فرض ۰ است."
patrolOrders: "Second attack patrol"
patrolOrders_descr: "Send the AI's second attack patrol group into assaults as well. Each AI's AIC value takes precedence."
patrolOrders_all: "Both patrol groups"
patrolOrders_native: "First group only"
patrolFormation: "Second patrol position"
patrolFormation_descr: "Where the second patrol group goes: beside the first group, or the other side of the target castle."
patrolFormation_wing: "Beside the first group"
patrolFormation_mirror: "Other side of the castle"
patrolFormation_native: "Own route"
patrolSpacing: "Patrol spacing"
patrolSpacing_descr: "Tiles between the two patrol groups when side by side; default 12."
lordHuntRetarget: "Siege the castle where the lord hides"
lordHuntRetarget_descr: "When a human player's lord shelters inside an ally's walls that the attackers cannot enter, the AI attacks that castle instead. Each AI's AIC value takes precedence."
lordHuntSiege: "Full siege on"
lordHuntSiege_descr: "Which castle gets the siege camp and engines when the army splits; the other castle gets a share of the troops."
lordHuntSiege_hiding: "The castle the lord hides in"
lordHuntSiege_home: "The lord's own castle"
lordHuntSplitShare: "Split share"
lordHuntSplitShare_descr: "Percent of the army sent to the other castle while the lord's own castle still has people and buildings; default 50."
lordHuntSwitchPercent: "Switch only with"
lordHuntSwitchPercent_descr: "During an attack the AI only turns to another castle while this percent of its army remains; default 80."
lordHuntShare: "Lord hunt share"
lordHuntShare_descr: "Percent of the army at the lord's castle that goes straight for him once the way is open; 0 turns the hunt off; default 50."
