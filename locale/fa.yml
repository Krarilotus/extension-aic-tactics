correctEngineerRoleCounting: "شمارش مهندسان در سهمیهٔ نیروها"
correctEngineerRoleCounting_descr: "مهندسانِ گماشته‌شده را در سهمیهٔ گروهشان می‌شمارد. خدمهٔ محاصره، خندق‌کن‌ها و کارکنان روغن نقش جداگانه دارند."
safeSiegePlacement: "حفاظت از نیروها هنگام ساخت ادوات محاصره"
safeSiegePlacement_descr: "روی نیروهای خودی ادوات محاصره نمی‌سازد. مقدار AIC هر هوش مصنوعی اولویت دارد."
actualSiegeResourcePayment: "نیاز به منابع برای ساخت ادوات محاصره"
actualSiegeResourcePayment_descr: "پیش از ساخت، مصالح و طلا را بررسی می‌کند. کمبودها وارد روند معمول خرید هوش مصنوعی می‌شوند. مقدار AIC هر هوش مصنوعی اولویت دارد."
coordinatedSiegeHarassment: "هماهنگی یورش ادوات محاصره"
coordinatedSiegeHarassment_descr: "ادوات محاصره را گرد می‌آورد و به مواضع تیراندازی قابل دسترس می‌فرستد. مقدار AIC هر هوش مصنوعی اولویت دارد."
siegeHarassMinEngines: "حداقل ادوات برای یورش"
siegeHarassMinEngines_descr: "تعداد ادواتی که پیش از حرکت منتظر می‌مانند. پس از یک ماه بازی، ادوات موجود اعزام می‌شوند؛ ۰ با اولین دستگاه حرکت می‌کند."
largerSiegeForces: "ادوات بیشتر برای حملهٔ اصلی"
largerSiegeForces_descr: "ترکیب محاصرهٔ همان هوش مصنوعی را تا سقف تعیین‌شده تکرار می‌کند. مقدار AIC هر هوش مصنوعی اولویت دارد."
siegeForceMax: "سقف ادوات در حملهٔ اصلی"
siegeForceMax_descr: "سقف اختیاری ابزارهای محاصره. با مقدار ۰، شمار مهندسان حملهٔ در دسترس تعداد را تعیین می‌کند؛ پیش‌فرض ۰ است."
patrolOrders: "گشت حملهٔ دوم"
patrolOrders_descr: "گروه دوم گشت حملهٔ هوش مصنوعی را نیز به تهاجم می‌فرستد. مقدار AIC هر هوش مصنوعی اولویت دارد."
patrolOrders_all: "هر دو گروه گشت"
patrolOrders_native: "فقط گروه نخست"
patrolFormation: "جای گشت‌های دیگر"
patrolFormation_descr: "گروه‌های گشت دیگر کجا می‌روند: کنار گروه نخست، آن سوی قلعهٔ هدف، یا روی حلقه‌ای دور آن."
patrolFormation_wing: "کنار گروه نخست"
patrolFormation_mirror: "آن سوی قلعه"
patrolFormation_native: "مسیر خودش"
patrolSpacing: "فاصلهٔ گشت‌ها"
patrolSpacing_descr: "تعداد خانه‌های میان گروه‌های گشتِ کنار هم؛ پیش‌فرض ۱۲."
lordHuntRetarget: "محاصرهٔ پناهگاه ارباب"
lordHuntRetarget_descr: "اگر ارباب یک بازیکن انسانی پشت دیوارهای متحدی پناه بگیرد که مهاجمان نمی‌توانند واردش شوند، هوش مصنوعی به همان قلعه حمله می‌کند. مقدار AIC هر هوش مصنوعی اولویت دارد."
lordHuntSiege: "محاصرهٔ کامل روی"
lordHuntSiege_descr: "وقتی ارتش تقسیم می‌شود، کدام قلعه اردوگاه محاصره و ادوات را می‌گیرد؛ قلعهٔ دیگر بخشی از نیروها را می‌گیرد."
lordHuntSiege_hiding: "قلعه‌ای که ارباب در آن پنهان است"
lordHuntSiege_home: "قلعهٔ خود ارباب"
lordHuntSplitShare: "سهم تقسیم"
lordHuntSplitShare_descr: "درصد ارتشی که به قلعهٔ دیگر می‌رود، تا وقتی قلعهٔ خود ارباب هنوز مردم و ساختمان دارد؛ پیش‌فرض ۵۰."
lordHuntSwitchPercent: "تغییر قلعه فقط با"
lordHuntSwitchPercent_descr: "در طول حمله، هوش مصنوعی فقط تا وقتی این درصد از ارتشش باقی است به قلعهٔ دیگری می‌رود؛ پیش‌فرض ۸۰."
lordHuntShare: "سهم شکار ارباب"
lordHuntShare_descr: "درصد ارتشِ کنار قلعهٔ ارباب که پس از باز شدن راه مستقیم به سراغ او می‌رود؛ ۰ شکار را خاموش می‌کند."
patrolFormation_routes: "دور قلعه و در امتداد جبههٔ آن"
patrolExtraGroups: "گروه‌های گشت اضافی"
patrolExtraGroups_descr: "در طول حمله، گشت هوش مصنوعی را به گروه‌های بیشتری تقسیم می‌کند، تا وقتی هر گروه کمترین اندازه را نگه دارد. پس از پایان حمله دوباره یکی می‌شوند؛ ۰ گروه‌های خود هوش مصنوعی را نگه می‌دارد."
patrolMinSize: "کوچک‌ترین گروه گشت"
patrolMinSize_descr: "تعداد نیروهایی که هر گروه هنگام تقسیم گشت نگه می‌دارد؛ پیش‌فرض ۴."
patrolRadius: "فاصلهٔ حلقهٔ گشت"
patrolRadius_descr: "فاصلهٔ پیاده از قلعهٔ هدف تا حلقه‌ای که گشت‌های چرخان و جاروکننده دنبال می‌کنند؛ پیش‌فرض ۱۲، مانند گشت خود بازی."
siegeScreen: "اسکورت ادوات محاصره"
siegeScreen_descr: "جای گروه‌های دفاع محاصرهٔ هوش مصنوعی هنگام کار ادوات: جلوی ادوات، دو گروه کنار ادوات مختلف، یا نقطهٔ تجمع خود بازی."
siegeScreen_engineApproach: "جلوی ادوات"
siegeScreen_native: "نقطهٔ تجمع بازی"
siegeScreenForward: "فاصلهٔ اسکورت"
siegeScreenForward_descr: "تعداد خانه‌ها جلوی ادوات برای اسکورت نزدیک‌زن؛ اسکورت دوربرد کنار ادوات می‌ماند. پیش‌فرض ۴."
siegeScreenExtraGroups: "گروه‌های اسکورت اضافی"
siegeScreenExtraGroups_descr: "هنگام کار ادوات، گروه‌های دفاع محاصرهٔ هوش مصنوعی را به گروه‌های بیشتری تقسیم می‌کند، تا وقتی هر گروه کمترین اندازه را نگه دارد؛ هر گروه از ادوات خودش محافظت می‌کند. پیش از حمله به دیوار دوباره یکی می‌شوند؛ ۰ دو گروه خود هوش مصنوعی را نگه می‌دارد. به اسکورت ادوات نیاز دارد."
siegeTowerCrew: "سرنشین برای برج‌های محاصره"
siegeTowerCrew_descr: "اگر بتوان از برج‌های محاصره بالا رفت، هوش مصنوعی نیروهای دفاع محاصره‌اش را سوار برج‌هایی می‌کند که به سوی دیوار می‌روند. مقدار AIC هر هوش مصنوعی اولویت دارد."
allyRelief: "نیروی کمکی برای متحد"
allyRelief_descr: "هوش مصنوعی بخشی از ارتش بیکارش را به متحدی (شما یا یک هوش مصنوعی) می‌فرستد که قلعه‌اش زیر حمله است، و نیز وقتی از او کمک بخواهید. مقدار AIC هر هوش مصنوعی اولویت دارد."
allyArmySharePercent: "سهم ارتش کمکی"
allyArmySharePercent_descr: "درصد ارتش حملهٔ بیکار که به کمک می‌رود؛ بقیه در خانه می‌ماند. ۰ هیچ نیرویی نمی‌فرستد، حتی با درخواست؛ پیش‌فرض ۷۵."
allyReliefMinMonths: "کمترین ماندن نیروی کمکی"
allyReliefMinMonths_descr: "حداقل ماه‌هایی که نیروی کمکی می‌ماند، حتی وقتی خانهٔ متحد دوباره آرام است. حملهٔ خودش، خطر برای خودش یا فراخوان شما باز هم آن را برمی‌گرداند. ۰ پس از یک ماه آرام برمی‌گرداند."
allyReliefGates: "باز کردن دروازه برای نیروی کمکی"
allyReliefGates_descr: "اگر دروازه‌های متحد بسته باشد، نیروی کمکی به یک دروازه می‌رود و دروازه برایش باز می‌شود، هنگام رفتن هم. دشمنان نزدیک دروازه می‌توانند پشت سرش وارد شوند."
allyReliefKeep: "نیروی کمکی روی ارگ"
allyReliefKeep_descr: "نیروهای کمکی، مانند کمک خود بازی، روی ارگ متحد می‌ایستند، نه جلوی ورودی آن."
allyGoods: "کالا و طلا برای متحدان"
allyGoods_descr: "متحدان هوش مصنوعی کالا و طلایی را که نمی‌توانند بخرند به هم می‌دهند، و متحد هوش مصنوعی با درخواست شما برایتان طلا می‌فرستد. مقدار AIC هر هوش مصنوعی اولویت دارد."
allyGoldKeep: "طلای نگه‌داشتهٔ بخشنده"
allyGoldKeep_descr: "طلایی که هوش مصنوعی پیش از هر بخشش همیشه برای سربازگیری خودش نگه می‌دارد، حتی با درخواست شما؛ پیش‌فرض ۱۰۰۰."
allyRecruitGoldBuffer: "کمک طلا برای سربازگیری"
allyRecruitGoldBuffer_descr: "به هوش مصنوعیِ ضعیف یا در خطر تا طلای سربازگیری‌اش به‌علاوهٔ این مقدار کمک می‌شود؛ پیش‌فرض ۳۰۰."
allyGoldSharePercent: "طلا همراه کالا"
allyGoldSharePercent_descr: "درصدی از طلای بالاتر از طلای نگه‌داشته که هوش مصنوعی بی‌درخواست به هدیهٔ کالا می‌افزاید. ۰ چیزی نمی‌افزاید، ولی طلای درخواستی باز هم فرستاده می‌شود؛ پیش‌فرض ۲۵."
allyMonthlyGivePercent: "سقف هدیهٔ ماهانه"
allyMonthlyGivePercent_descr: "درصدی از هر کالا، از جمله طلا، که هوش مصنوعی در هر ماه می‌بخشد. ۰ چیزی نمی‌بخشد؛ پیش‌فرض ۳۰."
diagnostics: "گزارش عیب‌یابی"
diagnostics_descr: "تصمیم‌های هر هوش مصنوعی دربارهٔ شکار ارباب، کمک به متحدان، هدیه‌ها و گشت‌های اضافی را در گزارش UCP می‌نویسد. به‌طور پیش‌فرض خاموش است."
