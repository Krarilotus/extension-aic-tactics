patrolOrders: "گشت حملهٔ دوم"
patrolOrders_descr: "گروه دوم گشت حملهٔ هوش مصنوعی را نیز به تهاجم می‌فرستد. مقدار AIC هر هوش مصنوعی اولویت دارد."
patrolOrders_all: "هر دو گروه گشت"
patrolOrders_native: "فقط گروه نخست"
patrolFormation: "جای گشت‌های دیگر"
patrolFormation_descr: "گروه‌های گشت دیگر کجا می‌روند: کنار گروه نخست، آن سوی قلعهٔ هدف، یا روی حلقه‌ای دور آن."
patrolFormation_wing: "کنار گروه نخست"
patrolFormation_mirror: "آن سوی قلعه"
patrolFormation_native: "مسیر خودش"
lordHuntRetarget: "محاصرهٔ پناهگاه ارباب"
lordHuntRetarget_descr: "اگر ارباب یک بازیکن انسانی پشت دیوارهای متحدی پناه بگیرد که مهاجمان نمی‌توانند واردش شوند، هوش مصنوعی به همان قلعه حمله می‌کند. مقدار AIC هر هوش مصنوعی اولویت دارد."
patrolFormation_routes: "دور قلعه و در امتداد جبههٔ آن"
siegeScreen: "اسکورت ادوات محاصره"
siegeScreen_descr: "جای گروه‌های دفاع محاصرهٔ هوش مصنوعی هنگام کار ادوات: جلوی ادوات، دو گروه کنار ادوات مختلف، یا نقطهٔ تجمع خود بازی."
siegeScreen_engineApproach: "جلوی ادوات"
siegeScreen_native: "نقطهٔ تجمع بازی"
siegeTowerCrew: "سرنشین برای برج‌های محاصره"
siegeTowerCrew_descr: "اگر بتوان از برج‌های محاصره بالا رفت، هوش مصنوعی نیروهای دفاع محاصره‌اش را سوار برج‌هایی می‌کند که به سوی دیوار می‌روند. مقدار AIC هر هوش مصنوعی اولویت دارد."
allyRelief: "نیروی کمکی برای متحد"
allyRelief_descr: "هوش مصنوعی بخشی از ارتش بیکارش را به متحدی (شما یا یک هوش مصنوعی) می‌فرستد که قلعه‌اش زیر حمله است، و نیز وقتی از او کمک بخواهید. مقدار AIC هر هوش مصنوعی اولویت دارد."
allyGoods: "کالا و طلا برای متحدان"
allyGoods_descr: "متحدان هوش مصنوعی کالا و طلایی را که نمی‌توانند بخرند به هم می‌دهند، و متحد هوش مصنوعی با درخواست شما برایتان طلا می‌فرستد. مقدار AIC هر هوش مصنوعی اولویت دارد."
ai: هوش مصنوعی
improvements: بهبودها
