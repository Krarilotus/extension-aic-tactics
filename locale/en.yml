legacyRecruitInterval: Keep Legacy recruitment timing
nativeInitialDefenseMonths: Initial defense period for Native AIs
nativeInitialDefenseMonths_descr: '0–30 months; default 6. Copy the former Legacy initial-timer value here, then turn that Legacy option OFF. WeightedRoles uses RecruitInitialDefenseMonths instead.'
legacyRecruitInterval_descr: 'Replaces Legacy ai_recruitinterval for Native personalities: use interval 1. WeightedRoles keeps each personality’s AIC intervals. Turn the Legacy option OFF; leave this OFF if it was already disabled.'
nativeTargetPolicy: "Target choice for Native AIs"
nativeTargetPolicy_descr: "Replaces Legacy ai_attacktarget. Copy its choice here and turn that Legacy option OFF when using new target policies. Native keeps TargetChoice."
nativeTargetPolicy_native: "Existing TargetChoice"
nativeTargetPolicy_nearest: "Nearest"
nativeTargetPolicy_richest: "Richest"
nativeTargetPolicy_weakest: "Weakest"
correctEngineerRoleCounting: "Count engineers in AI troop quotas"
correctEngineerRoleCounting_descr: "Count assigned engineers toward their troop quota. Siege crews, moat diggers and oil workers keep their separate roles."
safeSiegePlacement: "Protect units at siege sites"
safeSiegePlacement_descr: "Avoid siege construction on friendly units. Each AI's AIC value takes precedence."
actualSiegeResourcePayment: "Require resources for siege construction"
actualSiegeResourcePayment_descr: "Check materials and gold before an AI builds siege equipment. Shortages enter normal AI trade. Each AI's AIC value overrides this fallback."
coordinatedSiegeHarassment: "Coordinate siege harassment"
coordinatedSiegeHarassment_descr: "Gather mobile siege engines, then send them to separate reachable firing positions. Each AI's AIC value takes precedence."
siegeHarassMinEngines: "Siege harass group size"
siegeHarassMinEngines_descr: "Ready engines to wait for before moving. After one game month, send those available. 0 sends the first ready engine."
largerSiegeForces: "More engines for main attacks"
largerSiegeForces_descr: "Repeat the AI's existing siege mix, up to its assault limit. Each AI's AIC value takes precedence."
siegeForceMax: "Engines per main attack"
siegeForceMax_descr: "Optional engine cap for larger assaults. 0 uses every available attack engineer; default 0."
patrolOrders: "Second attack patrol"
patrolOrders_descr: "Send the AI's second attack patrol group into assaults as well. Each AI's AIC value takes precedence."
patrolOrders_all: "Both patrol groups"
patrolOrders_native: "First group only"
patrolFormation: "Second patrol position"
patrolFormation_descr: "Where the second patrol group goes: beside the first group, or the other side of the target castle."
patrolFormation_wing: "Beside the first group"
patrolFormation_mirror: "Other side of the castle"
patrolFormation_native: "Own route"
patrolSpacing: "Patrol spacing"
patrolSpacing_descr: "Tiles between the two patrol groups when side by side; default 12."
allyRelief: "Ally relief"
allyRelief_descr: "An AI sends part of its idle army to an ally (you or an AI) whose castle is under attack, and when you ask it for help. Each AI's AIC value takes precedence."
allyArmySharePercent: "Relief army share"
allyArmySharePercent_descr: "Percent of the idle attack army sent to help; the rest stays home. 0 sends no troops, also when asked; default 75."
allyGoods: "Ally goods and gold"
allyGoods_descr: "AI allies give each other goods and gold they cannot buy, and an AI ally sends you gold when you ask. Each AI's AIC value takes precedence."
allyGoldKeep: "Gold kept by givers"
allyGoldKeep_descr: "Gold an AI always keeps for its own recruiting before it gives any away, also when you ask; default 1000."
allyRecruitGoldBuffer: "Recruit gold help"
allyRecruitGoldBuffer_descr: "A weak or threatened AI is helped up to its recruiting gold plus this much; default 300."
allyGoldSharePercent: "Gold share with goods"
allyGoldSharePercent_descr: "Percent of the gold above the kept gold that an AI adds to a goods gift unasked. 0 adds none, but asked gold is still sent; default 25."
allyMonthlyGivePercent: "Monthly gift limit"
allyMonthlyGivePercent_descr: "Percent of each good, gold included, an AI gives away per month. 0 gives nothing; default 30."
