correctEngineerRoleCounting: "Compter les ingénieurs dans les quotas"
correctEngineerRoleCounting_descr: "Compte les ingénieurs affectés à leur groupe. Les servants de siège, les fossoyeurs et les préposés à l’huile gardent leurs rôles distincts."
safeSiegePlacement: "Protéger les unités lors d’un siège"
safeSiegePlacement_descr: "Évite de construire sur ses propres unités. La valeur AIC de chaque IA prévaut."
actualSiegeResourcePayment: "Exiger les ressources pour le siège"
actualSiegeResourcePayment_descr: "Vérifie les matériaux et l’or avant la construction. Les manques passent par le commerce normal de l’IA. La valeur AIC de chaque IA prime."
coordinatedSiegeHarassment: "Coordonner le harcèlement de siège"
coordinatedSiegeHarassment_descr: "Rassemble les engins et les envoie vers des positions de tir accessibles. La valeur AIC de chaque IA prime."
siegeHarassMinEngines: "Engins à rassembler"
siegeHarassMinEngines_descr: "Nombre d’engins attendus avant le départ. Après un mois de jeu, les engins disponibles partent ; 0 lance le premier."
largerSiegeForces: "Plus d’engins pour l’assaut principal"
largerSiegeForces_descr: "Répète la composition de siège de cette IA jusqu’à sa limite. La valeur AIC de chaque IA prime."
siegeForceMax: "Engins par assaut principal"
siegeForceMax_descr: "Plafond facultatif des engins. À 0, les ingénieurs d’attaque disponibles déterminent le nombre ; valeur par défaut : 0."
patrolOrders: "Seconde patrouille d’attaque"
patrolOrders_descr: "Envoie aussi le second groupe de patrouille d’attaque de l’IA dans les assauts. La valeur AIC de chaque IA prime."
patrolOrders_all: "Les deux groupes"
patrolOrders_native: "Premier groupe seul"
patrolFormation: "Position des autres patrouilles"
patrolFormation_descr: "Où vont les autres groupes de patrouille : à côté du premier, de l’autre côté du château ciblé ou sur un anneau autour de lui."
patrolFormation_wing: "À côté du premier groupe"
patrolFormation_mirror: "De l’autre côté du château"
patrolFormation_native: "Itinéraire propre"
patrolSpacing: "Écart des patrouilles"
patrolSpacing_descr: "Cases entre les groupes de patrouille côte à côte ; par défaut : 12."
lordHuntRetarget: "Assiéger le refuge du seigneur"
lordHuntRetarget_descr: "Si le seigneur d’un joueur humain s’abrite derrière les murs d’un allié où les assaillants ne peuvent entrer, l’IA attaque ce château. La valeur AIC de chaque IA prime."
lordHuntSiege: "Siège complet sur"
lordHuntSiege_descr: "Le château qui reçoit le camp de siège et les engins quand l’armée se divise ; l’autre reçoit une part des troupes."
lordHuntSiege_hiding: "Le château où il se cache"
lordHuntSiege_home: "Le château du seigneur"
lordHuntSplitShare: "Part détachée"
lordHuntSplitShare_descr: "Pourcentage de l’armée envoyé à l’autre château tant que celui du seigneur a encore habitants et bâtiments ; par défaut : 50."
lordHuntSwitchPercent: "Changer seulement avec"
lordHuntSwitchPercent_descr: "Pendant une attaque, l’IA ne change de château que s’il lui reste ce pourcentage de son armée ; par défaut : 80."
lordHuntShare: "Part de la chasse"
lordHuntShare_descr: "Pourcentage de l’armée au château du seigneur qui fonce sur lui dès que la voie est libre ; 0 désactive la chasse."
patrolFormation_routes: "Autour du château et le long de son front"
patrolExtraGroups: "Groupes de patrouille en plus"
patrolExtraGroups_descr: "Divise la patrouille de l’IA en plus de groupes pendant une attaque, tant que chacun garde la taille minimale. Ils se regroupent à la fin ; 0 garde les groupes de l’IA."
patrolMinSize: "Groupe de patrouille minimal"
patrolMinSize_descr: "Unités que garde chaque groupe quand la patrouille est divisée ; par défaut : 4."
patrolRadius: "Distance de l’anneau"
patrolRadius_descr: "Distance de marche entre le château ciblé et l’anneau que suivent les patrouilles qui tournent et balaient ; par défaut : 12, comme la patrouille du jeu."
siegeScreen: "Escorte des engins de siège"
siegeScreen_descr: "Où se tiennent les groupes de défense de siège de l’IA pendant que ses engins travaillent : devant les engins, les deux groupes à des engins différents, ou au ralliement du jeu."
siegeScreen_engineApproach: "Devant les engins"
siegeScreen_native: "Ralliement du jeu"
siegeScreenForward: "Distance d’escorte"
siegeScreenForward_descr: "Cases devant les engins pour l’escorte de mêlée ; l’escorte à distance reste aux engins. Par défaut : 4."
siegeScreenExtraGroups: "Groupes d’escorte en plus"
siegeScreenExtraGroups_descr: "Divise les groupes de défense de siège de l’IA en plus de groupes pendant que les engins travaillent, tant que chacun garde la taille minimale ; chaque groupe garde son engin. Ils se regroupent avant l’assaut des murs ; 0 garde les deux groupes de l’IA. Exige l’escorte des engins."
siegeTowerCrew: "Garnir les tours de siège"
siegeTowerCrew_descr: "Si les tours de siège peuvent être escaladées, l’IA fait monter ses troupes de défense de siège dans ses tours en route vers les murs. La valeur AIC de chaque IA prévaut."
allyRelief: "Secours aux alliés"
allyRelief_descr: "Une IA envoie une partie de son armée inactive à un allié (vous ou une IA) dont le château est attaqué, et quand vous lui demandez de l’aide. La valeur AIC de chaque IA prime."
allyArmySharePercent: "Part de l’armée de secours"
allyArmySharePercent_descr: "Pourcentage de l’armée d’attaque inactive envoyé en aide ; le reste demeure au château. 0 n’envoie personne, même sur demande ; par défaut : 75."
allyReliefMinMonths: "Séjour minimal du secours"
allyReliefMinMonths_descr: "Nombre minimal de mois que reste le secours, même quand l’allié est de nouveau en paix. Sa propre attaque, son propre danger ou votre appel le rappellent quand même. 0 le rappelle après un mois calme."
allyReliefGates: "Portes ouvertes au secours"
allyReliefGates_descr: "Si les portes de l’allié sont fermées, le secours va à une porte qui s’ouvre pour lui, à l’arrivée comme au départ. Les ennemis proches peuvent entrer à sa suite."
allyReliefKeep: "Secours sur le donjon"
allyReliefKeep_descr: "Les troupes de secours se placent sur le donjon de l’allié, comme avec l’aide du jeu, plutôt qu’à son entrée."
allyGoods: "Biens et or entre alliés"
allyGoods_descr: "Les alliés IA se donnent les biens et l’or qu’ils ne peuvent acheter, et un allié IA vous envoie de l’or sur demande. La valeur AIC de chaque IA prime."
allyGoldKeep: "Or gardé par les donateurs"
allyGoldKeep_descr: "Or qu’une IA garde toujours pour recruter avant de donner quoi que ce soit, même sur votre demande ; par défaut : 1000."
allyRecruitGoldBuffer: "Aide en or pour recruter"
allyRecruitGoldBuffer_descr: "Une IA faible ou menacée est aidée jusqu’à son or de recrutement plus ce montant ; par défaut : 300."
allyGoldSharePercent: "Or joint aux biens"
allyGoldSharePercent_descr: "Pourcentage de l’or au-delà de la réserve qu’une IA joint d’elle-même à un don de biens. 0 n’ajoute rien, l’or demandé reste envoyé ; par défaut : 25."
allyMonthlyGivePercent: "Limite mensuelle des dons"
allyMonthlyGivePercent_descr: "Pourcentage de chaque bien, or compris, qu’une IA donne par mois. 0 ne donne rien ; par défaut : 30."
diagnostics: "Journal de diagnostic"
diagnostics_descr: "Écrit dans le journal UCP les décisions de chaque IA sur la chasse au seigneur, l’aide aux alliés, les dons et les patrouilles supplémentaires. Désactivé par défaut."
ai: IA
fixes: Correctifs
improvements: Améliorations
