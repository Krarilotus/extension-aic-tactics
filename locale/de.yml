correctEngineerRoleCounting: "Ingenieure richtig zählen"
correctEngineerRoleCounting_descr: "Zählt zugewiesene Ingenieure im jeweiligen Truppenverband. Besatzungen, Grabendienste und Ölarbeiter behalten ihre eigenen Aufgaben."
safeSiegePlacement: "Eigene Einheiten beim Belagerungsbau schützen"
safeSiegePlacement_descr: "Verhindert den Bau von Belagerungsgeräten auf eigenen Einheiten. Der AIC-Wert hat Vorrang."
actualSiegeResourcePayment: "Belagerungsbau nur mit Rohstoffen"
actualSiegeResourcePayment_descr: "Prüft Rohstoffe und Gold vor dem Bau. Fehlmengen gehen in den normalen KI-Handel. Der AIC-Wert je KI hat Vorrang."
coordinatedSiegeHarassment: "Belagerungsangriffe koordinieren"
coordinatedSiegeHarassment_descr: "Belagerungsgeräte sammeln und gemeinsam zu erreichbaren Schusspositionen schicken. Der AIC-Wert je KI hat Vorrang."
siegeHarassMinEngines: "Mindestzahl für Belagerungsangriffe"
siegeHarassMinEngines_descr: "So viele Geräte vor dem Aufbruch abwarten. Nach einem Spielmonat starten die vorhandenen; 0 startet mit dem ersten Gerät."
largerSiegeForces: "Mehr Belagerungsgeräte im Hauptangriff"
largerSiegeForces_descr: "Wiederholt den eingestellten Gerätemix bis zur Obergrenze. AIC-Werte je KI haben Vorrang."
siegeForceMax: "Geräte pro Hauptangriff"
siegeForceMax_descr: "Optionale Geräteobergrenze. Bei 0 bestimmen die verfügbaren Angriffsingenieure die Zahl; Standard 0."
patrolOrders: "Zweite Angriffspatrouille"
patrolOrders_descr: "Schickt auch die zweite Angriffspatrouillengruppe der KI in Angriffe. Der AIC-Wert je KI hat Vorrang."
patrolOrders_all: "Beide Patrouillengruppen"
patrolOrders_native: "Nur die erste Gruppe"
patrolFormation: "Position weiterer Patrouillen"
patrolFormation_descr: "Wohin die weiteren Patrouillengruppen ziehen: neben die erste Gruppe, auf die andere Seite der Zielburg oder auf einen Ring um sie."
patrolFormation_wing: "Neben der ersten Gruppe"
patrolFormation_mirror: "Andere Seite der Burg"
patrolFormation_native: "Eigene Route"
patrolSpacing: "Patrouillenabstand"
patrolSpacing_descr: "Felder zwischen den Patrouillengruppen, wenn sie nebeneinander ziehen; Standard 12."
lordHuntRetarget: "Versteck des Burgherrn belagern"
lordHuntRetarget_descr: "Versteckt sich der Burgherr eines menschlichen Spielers hinter Mauern eines Verbündeten, die die Angreifer nicht betreten können, greift die KI diese Burg an. Der AIC-Wert je KI hat Vorrang."
lordHuntSiege: "Volle Belagerung auf"
lordHuntSiege_descr: "Welche Burg Belagerungslager und Geräte erhält, wenn sich die Armee teilt; die andere Burg erhält einen Teil der Truppen."
lordHuntSiege_hiding: "Burg mit dem Versteck"
lordHuntSiege_home: "Eigene Burg des Burgherrn"
lordHuntSplitShare: "Aufteilung"
lordHuntSplitShare_descr: "Prozent der Armee für die andere Burg, solange die eigene Burg des Burgherrn noch Bewohner und Gebäude hat; Standard 50."
lordHuntSwitchPercent: "Wechsel nur mit"
lordHuntSwitchPercent_descr: "Während eines Angriffs wechselt die KI nur die Burg, solange dieser Prozentsatz ihrer Armee übrig ist; Standard 80."
lordHuntShare: "Anteil für die Jagd"
lordHuntShare_descr: "Prozent der Armee an der Burg des Burgherrn, der direkt auf ihn losgeht, sobald der Weg frei ist; 0 schaltet die Jagd aus."
patrolFormation_routes: "Um die Burg und entlang ihrer Front"
patrolExtraGroups: "Zusätzliche Patrouillengruppen"
patrolExtraGroups_descr: "Teilt die Patrouille der KI während eines Angriffs in mehr Gruppen, solange jede die Mindestgröße behält. Nach dem Angriff vereinen sie sich wieder; 0 behält die Gruppen der KI."
patrolMinSize: "Kleinste Patrouillengruppe"
patrolMinSize_descr: "Einheiten, die jede Gruppe beim Teilen der Patrouille behält; Standard 4."
patrolRadius: "Abstand des Patrouillenrings"
patrolRadius_descr: "Laufweg von der Zielburg zum Ring, dem kreisende und streifende Patrouillen folgen; Standard 12 wie bei der Patrouille des Spiels."
siegeScreen: "Geleitschutz für Belagerungsgeräte"
siegeScreen_descr: "Wo die Belagerungsschutz-Gruppen der KI stehen, während ihre Geräte arbeiten: vor den Geräten, beide Gruppen an verschiedenen Geräten oder am Sammelpunkt des Spiels."
siegeScreen_engineApproach: "Vor den Geräten"
siegeScreen_native: "Sammelpunkt des Spiels"
siegeScreenForward: "Abstand des Geleitschutzes"
siegeScreenForward_descr: "Felder vor den Geräten für Nahkampf-Geleitschutz; Fernkämpfer bleiben an den Geräten. Standard 4."
siegeScreenExtraGroups: "Zusätzliche Geleitschutzgruppen"
siegeScreenExtraGroups_descr: "Teilt die Belagerungsschutz-Gruppen der KI in mehr Gruppen, solange ihre Geräte arbeiten und jede die Mindestgröße behält; jede Gruppe schützt ihr eigenes Gerät. Vor dem Mauersturm vereinen sie sich; 0 behält die zwei Gruppen der KI. Benötigt den Geleitschutz."
siegeTowerCrew: "Belagerungstürme besetzen"
siegeTowerCrew_descr: "Wenn Belagerungstürme erklettert werden können, besetzt die KI ihre Türme auf dem Weg zur Mauer mit ihren Belagerungsschutz-Truppen. Der AIC-Wert hat Vorrang."
allyRelief: "Entsatz für Verbündete"
allyRelief_descr: "Eine KI schickt einen Teil ihrer freien Armee zu einem Verbündeten (dir oder einer KI), dessen Burg angegriffen wird, und wenn du sie um Hilfe bittest. Der AIC-Wert je KI hat Vorrang."
allyArmySharePercent: "Armeeanteil für Entsatz"
allyArmySharePercent_descr: "Prozent der freien Angriffsarmee, der hilft; der Rest bleibt zu Hause. 0 schickt keine Truppen, auch nicht auf Bitte; Standard 75."
allyReliefMinMonths: "Mindestdauer des Entsatzes"
allyReliefMinMonths_descr: "So viele Monate bleibt der Entsatz mindestens, auch wenn beim Verbündeten wieder Ruhe ist. Ein eigener Angriff, eigene Gefahr oder dein Ruf holen ihn trotzdem heim. 0 holt ihn nach einem ruhigen Monat heim."
allyReliefGates: "Tore für den Entsatz öffnen"
allyReliefGates_descr: "Sind die Tore des Verbündeten zu, geht der Entsatz zu einem Tor, und es öffnet sich für ihn, auch beim Abzug. Feinde nahe dem Tor können mit hinein."
allyReliefKeep: "Entsatz auf den Bergfried"
allyReliefKeep_descr: "Entsatztruppen stehen wie bei der Hilfe des Spiels auf dem Bergfried des Verbündeten statt an seinem Eingang."
allyGoods: "Waren und Gold für Verbündete"
allyGoods_descr: "KI-Verbündete geben einander Waren und Gold, die sie nicht kaufen können, und eine verbündete KI schickt dir auf Bitte Gold. Der AIC-Wert je KI hat Vorrang."
allyGoldKeep: "Goldreserve der Geber"
allyGoldKeep_descr: "Gold, das eine KI immer für die eigene Rekrutierung behält, bevor sie etwas abgibt, auch auf deine Bitte; Standard 1000."
allyRecruitGoldBuffer: "Hilfe für Rekrutierungsgold"
allyRecruitGoldBuffer_descr: "Eine schwache oder bedrohte KI erhält Hilfe bis zu ihrem Rekrutierungsgold plus diesem Betrag; Standard 300."
allyGoldSharePercent: "Goldanteil zu Waren"
allyGoldSharePercent_descr: "Prozent des Goldes über der Reserve, den eine KI ungefragt einem Warengeschenk beilegt. 0 legt nichts bei, erbetenes Gold wird trotzdem geschickt; Standard 25."
allyMonthlyGivePercent: "Monatliche Geschenkgrenze"
allyMonthlyGivePercent_descr: "Prozent jeder Ware, Gold eingeschlossen, die eine KI pro Monat abgibt. 0 gibt nichts; Standard 30."
diagnostics: "Diagnoseprotokoll"
diagnostics_descr: "Schreibt die Entscheidungen jeder KI zu Burgherrenjagd, Verbündetenhilfe, Geschenken und zusätzlichen Patrouillen ins UCP-Log. Standardmäßig aus."
