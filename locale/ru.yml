correctEngineerRoleCounting: "Учитывать инженеров в квотах войск"
correctEngineerRoleCounting_descr: "Учитывает назначенных инженеров в их отрядах. Осадные расчёты, землекопы и работники с маслом сохраняют отдельные роли."
safeSiegePlacement: "Защищать войска при осадном строительстве"
safeSiegePlacement_descr: "Не строит осадные машины поверх своих войск. Значение AIC каждого ИИ имеет приоритет."
actualSiegeResourcePayment: "Требовать ресурсы для осады"
actualSiegeResourcePayment_descr: "Перед постройкой проверяет материалы и золото. Недостающее поступает в обычную торговую очередь ИИ. Значение AIC каждого ИИ имеет приоритет."
coordinatedSiegeHarassment: "Согласованный рейд осадных машин"
coordinatedSiegeHarassment_descr: "Собирает осадные машины и отправляет их на доступные огневые позиции. Значение AIC каждого ИИ имеет приоритет."
siegeHarassMinEngines: "Число машин для рейда"
siegeHarassMinEngines_descr: "Сколько машин ждать перед выходом. Через игровой месяц отправляются имеющиеся; 0 — выход с первой машиной."
largerSiegeForces: "Больше осадных машин в главной атаке"
largerSiegeForces_descr: "Повторяет заданный состав осадных машин до указанного предела. Значение AIC каждого ИИ имеет приоритет."
siegeForceMax: "Машин на главную атаку"
siegeForceMax_descr: "Необязательный предел осадных машин. При 0 число определяют доступные инженеры атаки; по умолчанию 0."
patrolOrders: "Второй атакующий патруль"
patrolOrders_descr: "Отправляет на штурм и вторую группу атакующего патруля ИИ. Значение AIC каждого ИИ имеет приоритет."
patrolOrders_all: "Обе группы патруля"
patrolOrders_native: "Только первая группа"
patrolFormation: "Позиция других патрулей"
patrolFormation_descr: "Куда идут другие группы патруля: рядом с первой, на другую сторону целевого замка или по кольцу вокруг него."
patrolFormation_wing: "Рядом с первой группой"
patrolFormation_mirror: "С другой стороны замка"
patrolFormation_native: "Свой маршрут"
patrolSpacing: "Интервал патрулей"
patrolSpacing_descr: "Клетки между группами патруля, идущими рядом; по умолчанию 12."
lordHuntRetarget: "Осаждать убежище лорда"
lordHuntRetarget_descr: "Если лорд игрока-человека укрылся за стенами союзника, куда атакующим не пройти, ИИ атакует этот замок. Значение AIC каждого ИИ имеет приоритет."
lordHuntSiege: "Полная осада"
lordHuntSiege_descr: "Какой замок получает осадный лагерь и машины, когда армия делится; другой замок получает часть войск."
lordHuntSiege_hiding: "Замок, где прячется лорд"
lordHuntSiege_home: "Собственный замок лорда"
lordHuntSplitShare: "Доля при разделении"
lordHuntSplitShare_descr: "Процент армии, идущий к другому замку, пока в собственном замке лорда есть люди и здания; по умолчанию 50."
lordHuntSwitchPercent: "Смена замка только при"
lordHuntSwitchPercent_descr: "Во время атаки ИИ переходит к другому замку, только пока у него остаётся этот процент армии; по умолчанию 80."
lordHuntShare: "Доля охоты на лорда"
lordHuntShare_descr: "Процент армии у замка лорда, идущий прямо на него, когда путь открыт; 0 отключает охоту."
patrolFormation_routes: "Вокруг замка и вдоль его фронта"
patrolExtraGroups: "Дополнительные группы патруля"
patrolExtraGroups_descr: "Делит патруль ИИ на большее число групп во время атаки, пока каждая сохраняет минимальный размер. После атаки они воссоединяются; 0 оставляет группы ИИ."
patrolMinSize: "Минимальная группа патруля"
patrolMinSize_descr: "Число воинов в каждой группе при делении патруля; по умолчанию 4."
patrolRadius: "Радиус кольца патруля"
patrolRadius_descr: "Расстояние пешком от целевого замка до кольца, по которому ходят кружащие и прочёсывающие патрули; по умолчанию 12, как у патруля игры."
siegeScreen: "Охрана осадных машин"
siegeScreen_descr: "Где стоят группы защиты осады ИИ, пока работают его машины: перед машинами, две группы у разных машин или в точке сбора игры."
siegeScreen_engineApproach: "Перед машинами"
siegeScreen_native: "Точка сбора игры"
siegeScreenForward: "Дистанция охраны"
siegeScreenForward_descr: "Клетки перед машинами для охраны ближнего боя; стрелки остаются у машин. По умолчанию 4."
siegeScreenExtraGroups: "Дополнительные группы охраны"
siegeScreenExtraGroups_descr: "Делит группы защиты осады ИИ на большее число групп, пока работают машины и каждая сохраняет минимальный размер; каждая группа охраняет свою машину. Перед штурмом стен они воссоединяются; 0 оставляет две группы ИИ. Требует охраны осадных машин."
siegeTowerCrew: "Экипажи осадных башен"
siegeTowerCrew_descr: "Если на осадные башни можно подниматься, ИИ сажает в свои башни, идущие к стенам, свои войска защиты осады. Значение AIC каждого ИИ имеет приоритет."
allyRelief: "Подкрепление союзникам"
allyRelief_descr: "ИИ отправляет часть свободной армии союзнику (вам или ИИ), чей замок атакован, а также по вашей просьбе. Значение AIC каждого ИИ имеет приоритет."
allyArmySharePercent: "Доля армии подкрепления"
allyArmySharePercent_descr: "Процент свободной атакующей армии, идущий на помощь; остальные остаются дома. 0 не отправляет войска, даже по просьбе; по умолчанию 75."
allyReliefMinMonths: "Минимальный срок подкрепления"
allyReliefMinMonths_descr: "Сколько месяцев подкрепление остаётся минимум, даже когда у союзника снова спокойно. Своя атака, своя опасность или ваш вызов всё равно возвращают его домой. 0 — возврат после одного спокойного месяца."
allyReliefGates: "Ворота для подкрепления"
allyReliefGates_descr: "Если ворота союзника закрыты, подкрепление подходит к воротам, и они открываются для него, также при уходе. Враги у ворот могут пройти следом."
allyReliefKeep: "Подкрепление на цитадели"
allyReliefKeep_descr: "Подкрепление встаёт на цитадели союзника, как при помощи игры, а не у входа."
allyGoods: "Товары и золото союзникам"
allyGoods_descr: "Союзники-ИИ отдают друг другу товары и золото, которые не могут купить, а союзник-ИИ присылает вам золото по просьбе. Значение AIC каждого ИИ имеет приоритет."
allyGoldKeep: "Запас золота дарителя"
allyGoldKeep_descr: "Золото, которое ИИ всегда оставляет на свой набор войск, прежде чем что-то отдать, даже по вашей просьбе; по умолчанию 1000."
allyRecruitGoldBuffer: "Помощь золотом на набор"
allyRecruitGoldBuffer_descr: "Слабому или находящемуся под угрозой ИИ помогают до его золота на набор плюс эта сумма; по умолчанию 300."
allyGoldSharePercent: "Золото к товарам"
allyGoldSharePercent_descr: "Процент золота сверх запаса, который ИИ сам добавляет к подарку товаров. 0 ничего не добавляет, но запрошенное золото всё равно отправляется; по умолчанию 25."
allyMonthlyGivePercent: "Месячный предел подарков"
allyMonthlyGivePercent_descr: "Процент каждого товара, включая золото, который ИИ отдаёт за месяц. 0 ничего не отдаёт; по умолчанию 30."
diagnostics: "Журнал диагностики"
diagnostics_descr: "Записывает в журнал UCP решения каждого ИИ об охоте на лорда, помощи союзникам, подарках и дополнительных патрулях. По умолчанию выключено."
