correctEngineerRoleCounting: "Mérnökök számolása a csapatkeretben"
correctEngineerRoleCounting_descr: "A beosztott mérnököket a csapatuk létszámába számítja. Az ostromkezelők, árokásók és olajkezelők külön szerepkörben maradnak."
safeSiegePlacement: "Saját egységek védelme ostromépítéskor"
safeSiegePlacement_descr: "Nem épít ostromeszközt saját egységekre. Az adott MI AIC-értéke elsőbbséget élvez."
actualSiegeResourcePayment: "Ostromépítés csak fedezettel"
actualSiegeResourcePayment_descr: "Építés előtt ellenőrzi az anyagokat és az aranyat. A hiány a szokásos MI-kereskedéshez kerül. Az egyes MI-k AIC-értéke elsőbbséget élvez."
coordinatedSiegeHarassment: "Ostromgépek összehangolt bevetése"
coordinatedSiegeHarassment_descr: "Összegyűjti az ostromgépeket, majd elérhető tüzelőállásokba küldi őket. Az egyes MI-k AIC-értéke elsőbbséget élvez."
siegeHarassMinEngines: "Bevetéshez várt ostromgépek"
siegeHarassMinEngines_descr: "Ennyi gépre vár indulás előtt. Egy játékbeli hónap után a meglévőket küldi; 0 az első géppel indul."
largerSiegeForces: "Több ostromgép a fő támadáshoz"
largerSiegeForces_descr: "A beállított ostromgép-összetételt ismétli a felső határig. Az egyes MI-k AIC-értéke elsőbbséget élvez."
siegeForceMax: "Ostromgépek fő támadásonként"
siegeForceMax_descr: "Választható ostromgép-korlát. A 0-nál a rendelkezésre álló támadó mérnökök száma dönt; alapérték: 0."
patrolOrders: "Második támadó járőr"
patrolOrders_descr: "Az MI második támadó járőrcsoportját is rohamba küldi. Az egyes MI-k AIC-értéke elsőbbséget élvez."
patrolOrders_all: "Mindkét járőrcsoport"
patrolOrders_native: "Csak az első csoport"
patrolFormation: "További járőrök helye"
patrolFormation_descr: "Hová mennek a további járőrcsoportok: az első csoport mellé, a célvár túloldalára vagy egy körre a vár körül."
patrolFormation_wing: "Az első csoport mellett"
patrolFormation_mirror: "A vár túloldalán"
patrolFormation_native: "Saját útvonal"
patrolSpacing: "Járőrök távolsága"
patrolSpacing_descr: "Mezők a járőrcsoportok között, ha egymás mellett haladnak; alapérték: 12."
lordHuntRetarget: "A várúr rejtekének ostroma"
lordHuntRetarget_descr: "Ha egy emberi játékos várura egy szövetséges falai mögé húzódik, ahová a támadók nem jutnak be, az MI azt a várat támadja. Az egyes MI-k AIC-értéke elsőbbséget élvez."
lordHuntSiege: "Teljes ostrom itt"
lordHuntSiege_descr: "Melyik vár kapja az ostromtábort és a gépeket, ha a sereg kettéválik; a másik vár a csapatok egy részét kapja."
lordHuntSiege_hiding: "A vár, ahol rejtőzik"
lordHuntSiege_home: "A várúr saját vára"
lordHuntSplitShare: "Megosztás"
lordHuntSplitShare_descr: "A sereg ennyi százaléka megy a másik várhoz, amíg a várúr saját várában még vannak lakók és épületek; alapérték: 50."
lordHuntSwitchPercent: "Váltás csak ennyivel"
lordHuntSwitchPercent_descr: "Támadás közben az MI csak akkor vált várat, ha seregének még ennyi százaléka megvan; alapérték: 80."
lordHuntShare: "Hajtóvadászat aránya"
lordHuntShare_descr: "A várúr váránál álló sereg ennyi százaléka rohan egyenesen rá, amint szabad az út; 0 kikapcsolja a hajtóvadászatot."
patrolFormation_routes: "A vár körül és az előterében"
patrolExtraGroups: "További járőrcsoportok"
patrolExtraGroups_descr: "Támadás közben több csoportra bontja az MI járőrét, amíg mindegyik megtartja a legkisebb létszámot. A támadás végén újra egyesülnek; 0 az MI saját csoportjait tartja."
patrolMinSize: "Legkisebb járőrcsoport"
patrolMinSize_descr: "Ennyi egységet tart meg minden csoport a járőr felosztásakor; alapérték: 4."
patrolRadius: "Járőrkör távolsága"
patrolRadius_descr: "A körbejáró és pásztázó járőrök körének gyalogos távolsága a célvártól; alapérték: 12, mint a játék saját járőrénél."
siegeScreen: "Ostromgépek fedezete"
siegeScreen_descr: "Hol állnak az MI ostromvédő csoportjai, amíg a gépei dolgoznak: a gépek előtt, a két csoport különböző gépeknél, vagy a játék saját gyülekezési pontján."
siegeScreen_engineApproach: "A gépek előtt"
siegeScreen_native: "A játék gyülekezési pontja"
siegeScreenForward: "Fedezet távolsága"
siegeScreenForward_descr: "Mezők a gépek előtt a közelharcos fedezetnek; a távolsági fedezet a gépeknél marad. Alapérték: 4."
siegeScreenExtraGroups: "További fedezőcsoportok"
siegeScreenExtraGroups_descr: "Több csoportra bontja az MI ostromvédő csoportjait, amíg a gépek dolgoznak és mindegyik megtartja a legkisebb létszámot; minden csoport a saját gépét védi. A falroham előtt újra egyesülnek; 0 az MI saját két csoportját tartja. Az ostromgépek fedezete szükséges hozzá."
siegeTowerCrew: "Ostromtornyok megrakása"
siegeTowerCrew_descr: "Ha az ostromtornyokra fel lehet mászni, az MI a falak felé haladó tornyaiba a jelenlegi támadóhullámának csapatait ülteti. Az adott MI AIC-értéke elsőbbséget élvez."
allyRelief: "Felmentés szövetségesnek"
allyRelief_descr: "Az MI tétlen seregének egy részét elküldi egy szövetségeshez (hozzád vagy egy MI-hez), akinek a várát megtámadták, és akkor is, ha segítséget kérsz. Az egyes MI-k AIC-értéke elsőbbséget élvez."
allyArmySharePercent: "Felmentő sereg aránya"
allyArmySharePercent_descr: "A tétlen támadó sereg ennyi százaléka megy segíteni; a többi otthon marad. 0 nem küld csapatot, kérésre sem; alapérték: 75."
allyReliefMinMonths: "Felmentés legrövidebb ideje"
allyReliefMinMonths_descr: "Legalább ennyi hónapig marad a felmentő sereg, akkor is, ha a szövetségesnél már nyugalom van. Saját támadása, saját veszélye vagy a hívásod így is hazahívja. 0 egy nyugodt hónap után hazahívja."
allyReliefGates: "Kapunyitás a felmentésnek"
allyReliefGates_descr: "Ha a szövetséges kapui zárva vannak, a felmentés egy kapuhoz megy, és az kinyílik neki, távozáskor is. A kapu közelében lévő ellenség utána nyomulhat."
allyReliefKeep: "Felmentés a vártoronyra"
allyReliefKeep_descr: "A felmentő csapatok a szövetséges vártornyára állnak, mint a játék saját segítségénél, nem a bejáratához."
allyGoods: "Áruk és arany szövetségeseknek"
allyGoods_descr: "Az MI-szövetségesek egymásnak adják a meg nem vehető árukat és aranyat, és egy MI-szövetséges kérésre aranyat küld neked. Az egyes MI-k AIC-értéke elsőbbséget élvez."
allyGoldKeep: "Adományozók aranytartaléka"
allyGoldKeep_descr: "Ennyi aranyat tart meg az MI mindig a saját toborzására, mielőtt bármit odaad, kérésedre is; alapérték: 1000."
allyRecruitGoldBuffer: "Toborzási arany segítség"
allyRecruitGoldBuffer_descr: "A gyenge vagy fenyegetett MI segítséget kap a toborzási aranyáig plusz ennyiig; alapérték: 300."
allyGoldSharePercent: "Arany az árukkal"
allyGoldSharePercent_descr: "A tartalék feletti arany ennyi százalékát teszi az MI kérés nélkül egy áruajándékhoz. 0 semmit sem tesz hozzá, de a kért aranyat így is elküldi; alapérték: 25."
allyMonthlyGivePercent: "Havi ajándékkorlát"
allyMonthlyGivePercent_descr: "Minden áruból, az aranyat is beleértve, ennyi százalékot ad oda az MI havonta. 0 semmit sem ad; alapérték: 30."
diagnostics: "Diagnosztikai napló"
diagnostics_descr: "Minden MI döntését a várúr üldözéséről, a szövetségesek segítéséről, az ajándékokról és a további őrjáratokról az UCP naplóba írja. Alapértelmezés szerint kikapcsolva."
