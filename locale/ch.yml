correctEngineerRoleCounting: "将工程兵计入部队配额"
correctEngineerRoleCounting_descr: "按所属部队统计已分配的工程兵。攻城器械乘员、挖壕兵和油锅值守人员仍按各自职责计算。"
safeSiegePlacement: "保护攻城建造地点的友军"
safeSiegePlacement_descr: "不会在自己的单位所在位置建造攻城器械。各 AI 的 AIC 设置优先。"
actualSiegeResourcePayment: "攻城建造需有资源"
actualSiegeResourcePayment_descr: "建造前检查材料和金币；缺少的材料交由 AI 的常规贸易购买。各 AI 的 AIC 设置优先。"
coordinatedSiegeHarassment: "协同攻城骚扰"
coordinatedSiegeHarassment_descr: "先集结攻城器械，再前往不同的可达射击位置。各 AI 的 AIC 设置优先。"
siegeHarassMinEngines: "攻城骚扰集结数量"
siegeHarassMinEngines_descr: "出发前等待的器械数量。一个游戏月后派出已有器械；0 表示有一台就出发。"
largerSiegeForces: "主攻建造更多攻城器械"
largerSiegeForces_descr: "重复使用该 AI 原有的攻城器械配置，直到达到上限。各 AI 的 AIC 设置优先。"
siegeForceMax: "每次主攻的器械上限"
siegeForceMax_descr: "可选的器械数量上限。设为 0 时由可用的进攻工程兵人数决定；默认 0。"
patrolOrders: "第二支进攻巡逻队"
patrolOrders_descr: "进攻时同时派出 AI 的第二支进攻巡逻队。各 AI 的 AIC 设置优先。"
patrolOrders_all: "两支巡逻队"
patrolOrders_native: "仅第一支"
patrolFormation: "其余巡逻队位置"
patrolFormation_descr: "其余巡逻队的去向：第一支队伍旁边、目标城堡另一侧，或绕城堡的环线。"
patrolFormation_wing: "第一支队伍旁边"
patrolFormation_mirror: "城堡另一侧"
patrolFormation_native: "自行选择路线"
patrolSpacing: "巡逻队间距"
patrolSpacing_descr: "巡逻队并排时相隔的格数；默认 12。"
lordHuntRetarget: "围攻领主藏身的城堡"
lordHuntRetarget_descr: "人类玩家的领主躲进攻方无法进入的盟友城墙内时，AI 改为进攻那座城堡。各 AI 的 AIC 设置优先。"
lordHuntSiege: "全力围攻目标"
lordHuntSiege_descr: "兵力分开时由哪座城堡获得攻城营地和器械；另一座城堡分到部分部队。"
lordHuntSiege_hiding: "领主藏身的城堡"
lordHuntSiege_home: "领主自己的城堡"
lordHuntSplitShare: "分兵比例"
lordHuntSplitShare_descr: "领主自己的城堡仍有人口和建筑时，派往另一座城堡的兵力百分比；默认 50。"
lordHuntSwitchPercent: "转攻所需兵力"
lordHuntSwitchPercent_descr: "进攻中，只有剩余兵力不低于此百分比时，AI 才会转攻另一座城堡；默认 80。"
lordHuntShare: "追击领主比例"
lordHuntShare_descr: "道路打通后，在领主所在城堡处直扑领主的兵力百分比；0 关闭追击。"
patrolFormation_routes: "绕城并沿正面巡逻"
patrolExtraGroups: "额外巡逻队"
patrolExtraGroups_descr: "进攻时把 AI 的巡逻队分成更多队伍，每队不少于最小人数。进攻结束后重新合并；0 保持 AI 原有队伍。"
patrolMinSize: "巡逻队最小人数"
patrolMinSize_descr: "拆分巡逻队时每队保留的单位数；默认 4。"
patrolRadius: "巡逻环距离"
patrolRadius_descr: "环绕和往返巡逻所走环线与目标城堡的步行距离；默认 12，与游戏原有巡逻相同。"
siegeScreen: "攻城器械护卫"
siegeScreen_descr: "攻城器械作业时 AI 攻城护卫队的位置：器械前方、两队分守不同器械，或游戏原有集结点。"
siegeScreen_engineApproach: "器械前方"
siegeScreen_native: "游戏原有集结点"
siegeScreenForward: "护卫距离"
siegeScreenForward_descr: "近战护卫站在器械前方的格数；远程护卫留在器械旁。默认 4。"
siegeScreenExtraGroups: "额外护卫队"
siegeScreenExtraGroups_descr: "器械作业时把 AI 的攻城护卫队分成更多队伍，每队不少于最小人数，各守一台器械。攻打城墙前重新合并；0 保持 AI 原有两队。需开启攻城器械护卫。"
siegeTowerCrew: "攻城塔载兵"
siegeTowerCrew_descr: "攻城塔可攀爬时，AI 会让攻城护卫队登上驶向城墙的攻城塔。各 AI 的 AIC 设置优先。"
allyRelief: "援救盟友"
allyRelief_descr: "盟友（你或 AI）的城堡遭到进攻时，或你请求援助时，AI 派出部分空闲军队。各 AI 的 AIC 设置优先。"
allyArmySharePercent: "援军比例"
allyArmySharePercent_descr: "派去援助的空闲进攻部队百分比，其余留守。0 不派兵，请求时也不派；默认 75。"
allyReliefMinMonths: "援军最短驻留"
allyReliefMinMonths_descr: "盟友家园恢复平静后援军至少停留的月数。自身遭到进攻、自身有危险或你召回时仍会返回。0 表示平静一个月后返回。"
allyReliefGates: "为援军开门"
allyReliefGates_descr: "盟友城门关闭时，援军走到城门前，城门为其打开，离开时也一样。门边的敌人可能跟着进来。"
allyReliefKeep: "援军登上主堡"
allyReliefKeep_descr: "援军像游戏原有援助一样站在盟友主堡上，而不是入口处。"
allyGoods: "盟友物资与金币"
allyGoods_descr: "AI 盟友互赠无法购买的物资和金币；你请求时，AI 盟友会送你金币。各 AI 的 AIC 设置优先。"
allyGoldKeep: "赠送方保留金币"
allyGoldKeep_descr: "AI 赠送前始终为自己招兵保留的金币，你请求时也一样；默认 1000。"
allyRecruitGoldBuffer: "招兵金币援助"
allyRecruitGoldBuffer_descr: "弱小或受威胁的 AI 获得援助，直到其招兵金币再加上此数；默认 300。"
allyGoldSharePercent: "随物资附赠金币"
allyGoldSharePercent_descr: "AI 主动随物资附赠的、超出保留金币部分的百分比。0 不附赠，但仍会送出请求的金币；默认 25。"
allyMonthlyGivePercent: "每月赠送上限"
allyMonthlyGivePercent_descr: "AI 每月赠出每种物资（含金币）的百分比。0 不赠送；默认 30。"
diagnostics: "诊断日志"
diagnostics_descr: "将每个 AI 关于追击领主、援助盟友、赠送物资和额外巡逻的决定写入 UCP 日志。默认关闭。"
