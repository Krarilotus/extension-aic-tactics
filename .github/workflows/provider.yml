name: Recruitment provider integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UnofficialCrusaderPatch/extension-aicloader
          ref: aef126a599a4bc68bbccbd1b3391d975ea7e2e46
          path: tests/deps/aicloader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 lupa==2.6
      - run: python -m pytest tests -q
